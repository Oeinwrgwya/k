<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Something about me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #050505;
    --text: #FFFFFF;
    --border: #FFFFFF;
    --accent: #FFFFFF;
    --font-title: 'Unbounded', sans-serif;
    --font-body: 'DM Sans', sans-serif;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    overflow: hidden;
  }

  body{
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.03), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(255,255,255,0.03), transparent 40%);
  }

  .viewport{
    position: relative;
    width: 100%;
    height: 100vh;
  }

  .page-view{
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
    transform: translateY(12px);
    transition: opacity .45s ease, transform .45s ease;
  }
  .page-view.active{
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }

  /* HOME */
  #home-view{
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 6vh 6vw;
  }

  .home-inner{
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    gap: 2rem;
    height: 100%;
    padding: 4vh 0;
  }

  .main-title{
    font-family: var(--font-title);
    font-weight: 700;
    font-size: clamp(1.6rem, 3.2vw, 2.4rem);
    letter-spacing: -0.01em;
    line-height: 1.2;
    margin: 0;
    flex-shrink: 0;
  }

  .main-title::after{
    content: "";
    display: block;
    width: 46px;
    height: 2px;
    background: var(--accent);
    margin-top: 1rem;
    opacity: .6;
  }

  .menu-scroll-container{
    overflow-y: auto;
    flex: 1;
    padding-right: 6px;
  }
  .menu-scroll-container::-webkit-scrollbar{ width: 4px; }
  .menu-scroll-container::-webkit-scrollbar-thumb{ background: rgba(255,255,255,.2); border-radius: 4px; }

  .nav-list{
    display: flex;
    flex-direction: column;
  }

  .nav-item{
    all: unset;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.05rem 0.25rem;
    border-bottom: 1px solid rgba(255,255,255,0.15);
    font-family: var(--font-body);
    font-size: clamp(0.95rem, 1.6vw, 1.08rem);
    color: var(--text);
    transition: padding-left .25s ease, opacity .25s ease;
  }
  .nav-item:first-child{ border-top: 1px solid rgba(255,255,255,0.15); }

  .nav-item .idx{
    font-family: var(--font-title);
    font-size: 0.7rem;
    opacity: .45;
    letter-spacing: .08em;
    min-width: 2.2em;
  }

  .nav-item .label{
    flex: 1;
    text-align: left;
  }

  .nav-item .arrow{
    font-family: var(--font-title);
    opacity: .5;
    transition: transform .25s ease, opacity .25s ease;
  }

  .nav-item:hover,
  .nav-item:focus-visible{
    padding-left: 0.7rem;
  }
  .nav-item:hover .arrow,
  .nav-item:focus-visible .arrow{
    transform: translateX(4px);
    opacity: 1;
    color: var(--accent);
  }
  .nav-item:hover .label,
  .nav-item:focus-visible .label{
    color: var(--accent);
  }
  .nav-item:focus-visible{
    outline: 1px dashed var(--accent);
    outline-offset: 4px;
  }

  /* DETAIL */
  #detail-view{
    display: flex;
    justify-content: flex-start;
    align-items: center;
    padding: 1vh 1vw 1vh 8vw;
    overflow: hidden;
  }

  .detail-container{
    width: 100%;
    max-width: 1400px;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 1.5rem;
  }

  .detail-text-col{
    display: flex;
    flex-direction: column;
    gap: 1.4rem;
    align-items: flex-start;
    text-align: left;
    flex: 1;
    min-width: 0;
  }

  .detail-tag{
    font-family: var(--font-body);
    font-size: 0.78rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    opacity: .55;
  }

  .detail-tag::before{
    content: "";
    display: inline-block;
    width: 22px;
    height: 1px;
    background: var(--accent);
    margin-right: 10px;
    vertical-align: middle;
    opacity: .8;
  }

  .detail-image{
    display: none;
    width: min(880px, 44vw);
    height: 78vh;
    object-fit: contain;
    filter: drop-shadow(0 12px 28px rgba(0,0,0,0.6));
    flex-shrink: 0;
  }
  .detail-image.visible{
    display: block;
  }

  .detail-text{
    font-family: var(--font-title);
    font-weight: 600;
    font-size: clamp(1.8rem, 5vw, 3rem);
    line-height: 1.15;
    margin: 0;
  }

  .back-btn{
    all: unset;
    cursor: pointer;
    margin-top: 1.5rem;
    align-self: flex-start;
    font-family: var(--font-body);
    font-size: 0.9rem;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 0.65rem 1.3rem;
    border-radius: 999px;
    transition: background .25s ease, color .25s ease, border-color .25s ease;
  }
  .back-btn:hover,
  .back-btn:focus-visible{
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }
  .back-btn:focus-visible{ outline: none; }

  @media (max-width: 560px){
    #home-view, #detail-view{ padding: 5vh 6vw; }
    .detail-container{
      flex-direction: column-reverse;
      align-items: flex-start;
      gap: 1.4rem;
    }
    .detail-image{
      width: min(280px, 70vw);
      height: 30vh;
      margin-left: 0;
    }
  }

  @media (prefers-reduced-motion: reduce){
    .page-view{ transition: none; }
    .nav-item, .arrow, .back-btn{ transition: none; }
  }
</style>
</head>
<body>

<div class="viewport">
  <div id="home-view" class="page-view active">
    <div class="home-inner">
      <h1 class="main-title" id="main-title">Something about me:</h1>
      <div class="menu-scroll-container">
        <nav class="nav-list" id="nav-list"></nav>
      </div>
    </div>
  </div>

  <div id="detail-view" class="page-view">
    <div class="detail-container">
      <div class="detail-text-col">
        <div class="detail-tag" id="detail-tag"></div>
        <h2 class="detail-text" id="detail-content"></h2>
        <button class="back-btn" id="back-action">← Back to Menu</button>
      </div>
      <img class="detail-image" id="detail-image" alt="" />
    </div>
  </div>
</div>

<script>
  // ---- Konfiguracja (dane domyślne z komponentu Genially) ----
  const CONFIG = {
    mainTitle: "Something about me:",
    backButtonLabel: "← Back to Menu",
    // itemImage jest opcjonalne — jeśli zostawisz pusty string "", obrazek się nie pokaże.
    // Najlepiej używać PNG bez tła (przezroczyste), np. z folderu assets/ w Twoim repo:
    // itemImage: "assets/raven.png"
    menuItems: [
      { itemLabel: "Mbti", itemContent: "Intj", itemImage: "" },
      { itemLabel: "Enneagram", itemContent: "6w5", itemImage: "" },
      { itemLabel: "Fav Color", itemContent: "Black", itemImage: "" },
      { itemLabel: "Fav Animal", itemContent: "Raven", itemImage: "" },
      { itemLabel: "Fav God", itemContent: "Hades", itemImage: "" },
      { itemLabel: "Fav Demon", itemContent: "Lord Beelzebub", itemImage: "" },
      { itemLabel: "Fav bending (Avatar)", itemContent: "Metal Bending", itemImage: "" },
      { itemLabel: "Fav titan (AOT)", itemContent: "War Hammer Titan", itemImage: "" },
      { itemLabel: "Fav Quirk (MHA)", itemContent: "Overhaul", itemImage: "" },
      { itemLabel: "Fav Pokemon (Pokémon)", itemContent: "Necrozma", itemImage: "assets/necrozma.png" },
      { itemLabel: "Fav Tank", itemContent: "American T29", itemImage: "" },
      { itemLabel: "Fav Melee Weapon", itemContent: "Spear", itemImage: "" },
      { itemLabel: "Fav Boss (DS3)", itemContent: "Nameless King", itemImage: "" },
      { itemLabel: "Fav Boss (Elden Ring)", itemContent: "Messmer the Impaler", itemImage: "" }
    ]
  };

  // ---- Render ----
  const homeView = document.getElementById('home-view');
  const detailView = document.getElementById('detail-view');
  const navList = document.getElementById('nav-list');
  const mainTitleEl = document.getElementById('main-title');
  const detailTag = document.getElementById('detail-tag');
  const detailImage = document.getElementById('detail-image');
  const detailContent = document.getElementById('detail-content');
  const backBtn = document.getElementById('back-action');

  mainTitleEl.textContent = CONFIG.mainTitle;
  backBtn.textContent = CONFIG.backButtonLabel;

  CONFIG.menuItems.forEach((item, i) => {
    const btn = document.createElement('button');
    btn.className = 'nav-item';
    btn.innerHTML = `
      <span class="idx">${String(i + 1).padStart(2, '0')}</span>
      <span class="label">${item.itemLabel}</span>
      <span class="arrow">→</span>
    `;
    btn.addEventListener('click', () => showDetail(item));
    navList.appendChild(btn);
  });

  function showDetail(item){
    detailTag.textContent = item.itemLabel;
    detailContent.textContent = item.itemContent;

    if (item.itemImage && item.itemImage.trim() !== ""){
      detailImage.src = item.itemImage;
      detailImage.alt = item.itemLabel;
      detailImage.classList.add('visible');
    } else {
      detailImage.classList.remove('visible');
      detailImage.removeAttribute('src');
    }

    homeView.classList.remove('active');
    detailView.classList.add('active');
  }

  function showHome(){
    detailView.classList.remove('active');
    homeView.classList.add('active');
  }

  backBtn.addEventListener('click', showHome);
</script>

</body>
</html>
