<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Something about me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #050505;
    --text: #FFFFFF;
    --border: #FFFFFF;
    --accent: #FFFFFF;
    --font-title: 'Unbounded', sans-serif;
    --font-body: 'DM Sans', sans-serif;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    overflow: hidden;
  }

  body{
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.03), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(255,255,255,0.03), transparent 40%);
  }

  .viewport{
    position: relative;
    width: 100%;
    height: 100vh;
  }

  .page-view{
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
    transform: translateY(12px);
    transition: opacity .45s ease, transform .45s ease;
  }
  .page-view.active{
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }

  /* HOME */
  #home-view{
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 6vh 6vw;
  }

  .home-inner{
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    gap: 2rem;
    height: 100%;
    padding: 4vh 0;
  }

  .main-title{
    font-family: var(--font-title);
    font-weight: 700;
    font-size: clamp(1.6rem, 3.2vw, 2.4rem);
    letter-spacing: -0.01em;
    line-height: 1.2;
    margin: 0;
    flex-shrink: 0;
  }

  .menu-scroll-container{
    overflow-y: auto;
    flex: 1;
    padding-right: 6px;
  }
  .menu-scroll-container::-webkit-scrollbar{ width: 4px; }
  .menu-scroll-container::-webkit-scrollbar-thumb{ background: rgba(255,255,255,.2); border-radius: 4px; }

  .nav-list{
    display: flex;
    flex-direction: column;
  }

  .nav-item{
    all: unset;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.05rem 0.25rem;
    border-bottom: 1px solid rgba(255,255,255,0.15);
    font-family: var(--font-body);
    font-size: clamp(0.95rem, 1.6vw, 1.08rem);
    color: var(--text);
    transition: padding-left .25s ease, opacity .25s ease;
  }
  .nav-item:first-child{ border-top: 1px solid rgba(255,255,255,0.15); }

  .nav-item .label{
    flex: 1;
    text-align: left;
  }

  .nav-item .arrow{
    font-family: var(--font-title);
    opacity: .5;
    transition: transform .25s ease, opacity .25s ease;
  }

  .nav-item:hover,
  .nav-item:focus-visible{
    padding-left: 0.7rem;
  }
  .nav-item:hover .arrow,
  .nav-item:focus-visible .arrow{
    transform: translateX(4px);
    opacity: 1;
    color: var(--accent);
  }
  .nav-item:hover .label,
  .nav-item:focus-visible .label{
    color: var(--accent);
  }
  .nav-item:focus-visible{
    outline: 1px dashed var(--accent);
    outline-offset: 4px;
  }

  /* DETAIL */
  #detail-view{
    display: flex;
    justify-content: flex-start;
    align-items: center;
    padding: 1vh 1vw 1vh 8vw;
    overflow: hidden;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transition: background-image .3s ease;
  }

  .detail-container{
    width: 100%;
    max-width: 1540px;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 1.5rem;
  }

  .detail-text-col{
    display: flex;
    flex-direction: column;
    gap: 1.4rem;
    align-items: flex-start;
    text-align: left;
    flex: 1;
    min-width: 0;
  }

  .detail-tag{
    font-family: var(--font-body);
    font-size: 0.78rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    opacity: .55;
  }

  .detail-tag::before{
    content: "";
    display: inline-block;
    width: 22px;
    height: 1px;
    background: var(--accent);
    margin-right: 10px;
    vertical-align: middle;
    opacity: .8;
  }

  .detail-image-wrap{
    display: none;
    position: relative;
    width: min(800px, 42vw);
    flex-shrink: 0;
    transform: translateY(-18px);
  }
  .detail-image-wrap.visible{
    display: block;
  }

  .detail-image{
    display: block;
    width: 100%;
    height: auto;
    max-height: 72vh;
    object-fit: contain;
    filter: drop-shadow(0 12px 28px rgba(0,0,0,0.6));
    pointer-events: none;
  }

  .detail-image-hit{
    position: absolute;
  }
  .detail-image-hit.swappable{
    cursor: pointer;
  }

  .detail-text{
    font-family: var(--font-title);
    font-weight: 600;
    font-size: clamp(1.8rem, 5vw, 3rem);
    line-height: 1.15;
    margin: 0;
  }

  .detail-description{
    display: none;
    font-family: var(--font-body);
    font-size: clamp(0.95rem, 1.5vw, 1.15rem);
    line-height: 1.6;
    color: var(--text);
    opacity: .75;
    margin: 0;
    max-width: 34ch;
  }
  .detail-description.visible{
    display: block;
  }



  @media (max-width: 560px){
    #home-view, #detail-view{ padding: 5vh 6vw; }
    .detail-container{
      flex-direction: column-reverse;
      align-items: flex-start;
      gap: 1.4rem;
    }
    .detail-image-wrap{
      width: min(280px, 70vw);
      margin-left: 0;
    }
    .detail-image{
      max-height: 30vh;
    }
  }

  @media (prefers-reduced-motion: reduce){
    .page-view{ transition: none; }
    .nav-item, .arrow{ transition: none; }
  }
</style>
</head>
<body>

<div class="viewport">
  <div id="home-view" class="page-view active">
    <div class="home-inner">
      <h1 class="main-title" id="main-title">Something about me:</h1>
      <div class="menu-scroll-container">
        <nav class="nav-list" id="nav-list"></nav>
      </div>
    </div>
  </div>

  <div id="detail-view" class="page-view">
    <div class="detail-container">
      <div class="detail-text-col">
        <div class="detail-tag" id="detail-tag"></div>
        <h2 class="detail-text" id="detail-content"></h2>
        <p class="detail-description" id="detail-description"></p>
      </div>
      <div class="detail-image-wrap" id="detail-image-wrap">
        <img class="detail-image" id="detail-image" alt="" />
        <div class="detail-image-hit" id="detail-image-hit"></div>
      </div>
    </div>
  </div>
</div>

<script>
  // ---- Konfiguracja (dane domyślne z komponentu Genially) ----
  const CONFIG = {
    mainTitle: "Something about me:",
    // itemDescription jest opcjonalne — jeśli niepuste, pojawi się pod tytułem po wejściu na stronę.
    menuItems: [
      { itemLabel: "Fav Pokemon (Pokémon)", itemContent: "Necrozma", itemImage: "assets/necrozma.png", itemImageAlt: "assets/necrozma2.png", itemBackground: "assets/necrozmabackground.png", itemDescription: "It survives by absorbing light. After a long time spent slumbering underground, impurities accumulated within it, causing its body to darken. Yes, it also absorbed page's colors." }
    ]
  };

  // ---- Render ----
  const homeView = document.getElementById('home-view');
  const detailView = document.getElementById('detail-view');
  const navList = document.getElementById('nav-list');
  const mainTitleEl = document.getElementById('main-title');
  const detailTag = document.getElementById('detail-tag');
  const detailImageWrap = document.getElementById('detail-image-wrap');
  const detailImage = document.getElementById('detail-image');
  const detailImageHit = document.getElementById('detail-image-hit');
  const detailContent = document.getElementById('detail-content');
  const detailDescription = document.getElementById('detail-description');

  mainTitleEl.textContent = CONFIG.mainTitle;

  CONFIG.menuItems.forEach((item, i) => {
    const btn = document.createElement('button');
    btn.className = 'nav-item';
    btn.innerHTML = `
      <span class="label">${item.itemLabel}</span>
      <span class="arrow">→</span>
    `;
    btn.addEventListener('click', () => showDetail(item));
    navList.appendChild(btn);
  });

  let typewriterToken = 0;

  function typewriterEffect(el, text, speed){
    const myToken = ++typewriterToken;
    el.textContent = '';
    let i = 0;
    function step(){
      if (myToken !== typewriterToken) return; // przerwane przez nowszy wpis
      if (i < text.length){
        el.textContent += text[i];
        i++;
        setTimeout(step, speed);
      }
    }
    step();
  }

  function positionImageHit(){
    if (!detailImageWrap.classList.contains('visible')) return;
    const imgRect = detailImage.getBoundingClientRect();
    const wrapRect = detailImageWrap.getBoundingClientRect();
    if (imgRect.width === 0 || imgRect.height === 0) return;

    const offsetLeft = imgRect.left - wrapRect.left;
    const offsetTop = imgRect.top - wrapRect.top;

    detailImageHit.style.left = (offsetLeft + imgRect.width / 4) + 'px';
    detailImageHit.style.top = (offsetTop + imgRect.height / 4) + 'px';
    detailImageHit.style.width = (imgRect.width / 2) + 'px';
    detailImageHit.style.height = (imgRect.height / 2) + 'px';
  }

  detailImage.addEventListener('load', positionImageHit);
  window.addEventListener('resize', positionImageHit);

  function showDetail(item){
    detailTag.textContent = item.itemLabel;
    detailContent.textContent = item.itemContent;

    if (item.itemDescription && item.itemDescription.trim() !== ""){
      detailDescription.classList.add('visible');
      typewriterEffect(detailDescription, item.itemDescription, 10);
    } else {
      typewriterToken++; // anuluj ewentualną trwającą animację
      detailDescription.textContent = "";
      detailDescription.classList.remove('visible');
    }

    if (item.itemBackground && item.itemBackground.trim() !== ""){
      detailView.style.backgroundColor = 'var(--bg)';
      detailView.style.backgroundImage =
        `linear-gradient(90deg, rgba(5,5,5,0.92) 0%, rgba(5,5,5,0.55) 45%, rgba(5,5,5,0.15) 100%), url("${item.itemBackground}")`;
    } else {
      detailView.style.backgroundColor = '';
      detailView.style.backgroundImage = "";
    }

    if (item.itemImage && item.itemImage.trim() !== ""){
      detailImage.src = item.itemImage;
      detailImage.alt = item.itemLabel;
      detailImageWrap.classList.add('visible');
      detailImage.dataset.imageA = item.itemImage;
      detailImage.dataset.imageB = (item.itemImageAlt && item.itemImageAlt.trim() !== "") ? item.itemImageAlt : "";
      if (detailImage.dataset.imageB){
        detailImageHit.classList.add('swappable');
      } else {
        detailImageHit.classList.remove('swappable');
      }
      // Odśwież pozycję hit-area od razu (na wypadek gdy obraz jest już w cache
      // i event 'load' się nie odpali) oraz po następnej klatce (po layoucie).
      positionImageHit();
      requestAnimationFrame(positionImageHit);
    } else {
      detailImageWrap.classList.remove('visible');
      detailImageHit.classList.remove('swappable');
      detailImage.removeAttribute('src');
      delete detailImage.dataset.imageA;
      delete detailImage.dataset.imageB;
    }

    homeView.classList.remove('active');
    detailView.classList.add('active');
  }

  detailImageHit.addEventListener('click', (e) => {
    e.stopPropagation();
    const { imageA, imageB } = detailImage.dataset;
    if (!imageB) return;
    const isShowingA = detailImage.getAttribute('src') === imageA;
    detailImage.src = isShowingA ? imageB : imageA;
  });

  function showHome(){
    detailView.classList.remove('active');
    homeView.classList.add('active');
  }

  // Brak widocznego przycisku "Back to Menu" — powrót działa przez:
  // klik w puste tło strony szczegółów oraz klawisz Escape.
  detailView.addEventListener('click', (e) => {
    if (e.target === detailView) showHome();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && detailView.classList.contains('active')) showHome();
  });
</script>

</body>
</html>
